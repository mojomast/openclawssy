name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  go-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fmt check
        run: |
          files=$(git ls-files '*.go')
          if [ -z "$files" ]; then
            echo "no go files to check"
            exit 0
          fi
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          if go list ./... >/dev/null 2>&1; then
            go vet ./...
          else
            echo "no packages to vet"
          fi

      - name: Test
        run: |
          if go list ./... >/dev/null 2>&1; then
            go test ./...
          else
            echo "no packages to test"
          fi

      - name: Build
        run: |
          if [ -d ./cmd/openclawssy ]; then
            go build -o ./bin/openclawssy ./cmd/openclawssy
          else
            echo "missing ./cmd/openclawssy"
          fi

      - name: Smoke CLI
        run: |
          ./bin/openclawssy --help || true
          ./bin/openclawssy doctor

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/mojomast/openclawssy:ci-${{ github.sha }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mojomast/openclawssy:latest
            ghcr.io/mojomast/openclawssy:${{ github.sha }}
