name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  go-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: CI quick profile (fmt+lint+test+smoke)
        run: make ci-quick

      - name: CI security profile
        run: make ci-security

      - name: CI race profile
        run: make ci-race
