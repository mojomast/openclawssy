services:
  openclawssy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      # REQUIRED: Z.AI API Key for GLM-4.7 Coding Plan
      # Get your key at: https://z.ai/subscribe
      # The ZAI Coding Plan uses endpoint: https://api.z.ai/api/coding/paas/v4
      - ZAI_API_KEY=${ZAI_API_KEY}
      
      # Optional: Server authentication token (default: change-me)
      - OPENCLAWSSY_TOKEN=${OPENCLAWSSY_TOKEN:-change-me}
      
      # Optional: Discord bot token for Discord integration
      # - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}

      # Docker sandbox configuration
      - SANDBOX_ACTIVE=${SANDBOX_ACTIVE:-true}
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-docker}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ubuntu:24.04}
      - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-1.0}
      - SANDBOX_MEMORY_LIMIT_MB=${SANDBOX_MEMORY_LIMIT_MB:-2048}
      - SANDBOX_NETWORK_ENABLED=${SANDBOX_NETWORK_ENABLED:-false}
    volumes:
      # Persist configuration and secrets across runs
      - ./.openclawssy:/app/.openclawssy
      # Mount Docker socket so the sandbox provider can spawn child containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volume for the default agent workspace (inside parent container)
      - openclawssy_ws_default:/workspace
    # Optional: enable advanced network diagnostics (tcpdump, some nmap modes)
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    # The entrypoint script handles initial setup and enables Docker sandbox
    command: ["serve", "--token", "${OPENCLAWSSY_TOKEN:-change-me}", "--addr", "0.0.0.0:8080", "--sandbox-active", "--sandbox-provider", "docker"]
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  openclawssy_ws_default:
