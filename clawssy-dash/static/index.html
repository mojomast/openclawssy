let treeData = null;

async function loadInspector() {
  let data;
  try {
    data = await fetchJSON('/api/tree');
  } catch {
    data = { tree: generateFallbackTree() };
  }

  const container = document.getElementById('file-tree');
  container.innerHTML = '';
  
  // Agent workspace tree
  const agentTree = data.tree || data;
  const agentLabel = document.createElement('div');
  agentLabel.style.cssText = 'font-size:0.75rem;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;margin-top:0.5rem;padding:0.3rem 0.4rem;border-bottom:1px solid var(--border)';
  agentLabel.textContent = 'Agent Workspace';
  container.appendChild(agentLabel);
  renderTree(container, agentTree);

  // Host workspace tree
  if (data.host_tree) {
    const hostLabel = document.createElement('div');
    hostLabel.style.cssText = 'font-size:0.75rem;font-weight:700;color:var(--accent-orange);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem;margin-top:1rem;padding:0.3rem 0.4rem;border-bottom:1px solid var(--border)';
    hostLabel.textContent = 'Host Workspace';
    container.appendChild(hostLabel);
    renderTree(container, data.host_tree);
  }

  // Tree search
  document.getElementById('tree-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const allNodes = container.querySelectorAll('.tree-node');
    const allChildren = container.querySelectorAll('.tree-children');
    if (!q) {
      allNodes.forEach(n => n.style.display = '');
      allChildren.forEach(c => c.classList.add('collapsed'));
      return;
    }
    allChildren.forEach(c => c.classList.remove('collapsed'));
    allNodes.forEach(n => {
      const name = (n.dataset.name || '').toLowerCase();
      n.style.display = name.includes(q) ? '' : 'none';
    });
  });
}

function renderTree(container, node, depth) {
  depth = depth || 0;
  const children = node.children || [];
  const isDir = node.type === 'directory' || node.type === 'folder' || children.length > 0;

  if (depth > 0) {
    const el = document.createElement('div');
    el.className = 'tree-node';
    el.dataset.name = node.name;
    el.dataset.path = node.path || '';

    if (isDir) {
      el.innerHTML = `<span class="arrow">&#9654;</span> &#128193; ${node.name}`;
    } else {
      el.innerHTML = `<span class="arrow" style="visibility:hidden">&#9654;</span> ${fileIcon(node.name, 'file')} ${node.name}`;
    }

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isDir) {
        const childContainer = el.nextElementSibling;
        if (childContainer && childContainer.classList.contains('tree-children')) {
          childContainer.classList.toggle('collapsed');
          el.querySelector('.arrow').classList.toggle('open');
        }
      } else {
        // Select file
        document.querySelectorAll('.tree-node.selected').forEach(n => n.classList.remove('selected'));
        el.classList.add('selected');
        loadFile(node.path || node.name);
      }
    });

    container.appendChild(el);
  }

  if (isDir && children.length > 0) {
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children' + (depth > 0 ? ' collapsed' : '');
    // Sort: directories first, then files
    const sorted = [...children].sort((a,b) => {
      const aDir = a.type === 'directory' || a.type === 'folder' || (a.children && a.children.length > 0);
      const bDir = b.type === 'directory' || b.type === 'folder' || (b.children && b.children.length > 0);
      if (aDir && !bDir) return -1;
      if (!aDir && bDir) return 1;
      return (a.name || '').localeCompare(b.name || '');
    });
    sorted.forEach(child => renderTree(childContainer, child, depth + 1));
    container.appendChild(childContainer);
  }
}

async function loadFile(path) {
  const contentPanel = document.getElementById('content-panel');
  const metaPanel = document.getElementById('meta-panel');
  contentPanel.innerHTML = '<div class="skeleton skeleton-line w80"></div><div class="skeleton skeleton-line w60"></div><div class="skeleton skeleton-line w80"></div>';

  let data;
  try {
    data = await fetchJSON('/api/file?path=' + encodeURIComponent(path));
  } catch {
    data = generateFallbackFile(path);
  }

  const name = data.name || path.split('/').pop();
  const ext = name.split('.').pop().toLowerCase();
  const cat = inferCategory(name, data.type);

  // Content
  let bodyHtml = '';
  const content = data.content || '';

  if (['md','markdown'].includes(ext)) {
    // Render markdown
    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });
    bodyHtml = `
      <div class="content-header">
        <span style="font-size:1.5rem">${fileIcon(name, 'file')}</span>
        <span class="content-title">${name}</span>
        <span class="tl-badge ${cat}" style="margin-left:auto">${cat}</span>
      </div>
      <div class="content-body">${marked.parse(content)}</div>
    `;
  } else if (['go','js','ts','py','rb','rs','c','cpp','java','sh','bash','yml','yaml','json','toml','xml','html','css','sql'].includes(ext)) {
    // Syntax-highlighted code
    const lang = hljs.getLanguage(ext) ? ext : null;
    const highlighted = lang ? hljs.highlight(content, { language: lang }).value : hljs.highlightAuto(content).value;
    bodyHtml = `
      <div class="content-header">
        <span style="font-size:1.5rem">${fileIcon(name, 'file')}</span>
        <span class="content-title">${name}</span>
        <span class="tl-badge ${cat}" style="margin-left:auto">${cat}</span>
      </div>
      <pre><code class="hljs">${highlighted}</code></pre>
    `;
  } else {
    // Raw text
    bodyHtml = `
      <div class="content-header">
        <span style="font-size:1.5rem">${fileIcon(name, 'file')}</span>
        <span class="content-title">${name}</span>
        <span class="tl-badge ${cat}" style="margin-left:auto">${cat}</span>
      </div>
      <div class="raw-content">${escapeHtml(content)}</div>
    `;
  }
  contentPanel.innerHTML = bodyHtml;

  // Metadata
  const refs = data.references || data.cross_references || [];
  metaPanel.innerHTML = `
    <h3>Metadata</h3>
    <div class="meta-row"><div class="mk">Path</div><div class="mv mono">${data.path || path}</div></div>
    <div class="meta-row"><div class="mk">Size</div><div class="mv">${formatBytes(data.size)}</div></div>
    <div class="meta-row"><div class="mk">Modified</div><div class="mv">${formatDate(data.modified)}</div></div>
    <div class="meta-row"><div class="mk">Type</div><div class="mv">${data.type || ext}</div></div>
    <div class="meta-row"><div class="mk">Category</div><div class="mv" style="color:${categoryColor(cat)}">${cat}</div></div>
    ${refs.length > 0 ? `
      <div class="meta-row"><div class="mk">Cross-References</div><div class="mv mono" style="font-size:0.7rem">${refs.map(r => `<div style="margin-bottom:2px;cursor:pointer;color:var(--secondary)" onclick="loadFile('${r}')">${r}</div>`).join('')}</div></div>
    ` : ''}
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ================================================================
   PROVENANCE PANEL
   ================================================================ */
async function loadProvenance() {
  let provData, agentData;

  try {
    provData = await fetchJSON('/api/provenance');
  } catch {
    provData = generateFallbackProvenance();
  }

  try {
    agentData = await fetchJSON('/api/agents');
  } catch {
    agentData = generateFallbackAgents();
  }

  // System info cards
  const provGrid = document.getElementById('prov-grid');
  const provItems = [
    { label: 'Hostname', value: (provData.container || {}).hostname || 'clawssy-dash', icon: '&#128230;' },
    { label: 'Agent Workspace', value: (provData.mounts || {}).workspace_root || '/data/workspace', icon: '&#128190;' },
    { label: 'Host Workspace', value: (provData.mounts || {}).host_workspace_root || '/data/host-workspace', icon: '&#128193;' },
    { label: 'Control Plane', value: (provData.mounts || {}).controlplane_root || '/data/controlplane', icon: '&#9881;' },
    { label: 'Model', value: ((provData.controlplane || {}).config || {}).model || 'GLM-5', icon: '&#129302;' },
  ];

  provGrid.innerHTML = provItems.map(p => `
    <div class="glass prov-card">
      <h4>${p.icon} ${p.label}</h4>
      <div class="prov-val">${p.value}</div>
    </div>
  `).join('');

  // Agent roster
  const agents = Array.isArray(agentData) ? agentData : (agentData.agents || []);
  const roster = document.getElementById('agent-roster');

  if (agents.length === 0) {
    roster.innerHTML = '<div class="empty-state"><div class="icon">&#129302;</div><h3>No agents found</h3></div>';
    return;
  }

  roster.innerHTML = '';
  agents.forEach(agent => {
    const card = document.createElement('div');
    card.className = 'glass agent-card';
    card.innerHTML = `
      <div class="agent-name">
        <span class="agent-dot"></span>
        ${agent.name || agent.id || 'unknown'}
      </div>
      <div class="agent-counts">
        <span>&#9889; ${agent.run_count || agent.runs || 0} runs</span>
        <span>&#128172; ${agent.chat_session_count || agent.sessions || 0} sessions</span>
      </div>
      <div class="agent-detail" id="agent-detail-${agent.name || agent.id}">
        <div class="skeleton skeleton-line w60"></div>
      </div>
    `;

    card.addEventListener('click', async () => {
      const wasExpanded = card.classList.contains('expanded');
      // Collapse all
      document.querySelectorAll('.agent-card.expanded').forEach(c => c.classList.remove('expanded'));
      if (wasExpanded) return;

      card.classList.add('expanded');
      const detail = card.querySelector('.agent-detail');

      let agentDetail;
      try {
        agentDetail = await fetchJSON('/api/agent/' + encodeURIComponent(agent.name || agent.id));
      } catch {
        // Generate fallback runs
        agentDetail = {
          name: agent.name,
          runs: Array.from({length: Math.min(agent.runs || 5, 10)}, (_, i) => ({
            run_id: 'run-' + (Math.floor(Math.random()*9000)+1000),
            started: new Date(Date.now() - Math.random()*86400000*3).toISOString(),
            duration: Math.floor(Math.random()*120) + 's',
            status: ['completed','completed','completed','failed'][Math.floor(Math.random()*4)]
          }))
        };
      }

      const runs = agentDetail.runs || [];
      if (runs.length === 0) {
        detail.innerHTML = '<div style="font-size:0.8rem;color:var(--text-dim);padding:0.5rem 0">No runs recorded</div>';
        return;
      }

      detail.innerHTML = runs.map(r => `
        <div class="run-item">
          <span class="run-id">${r.run_id || r.id || '?'}</span>
          <span style="font-size:0.75rem;color:${r.status === 'failed' ? '#ef4444' : 'var(--accent-green)'}">${r.status || 'completed'}</span>
          <span class="run-time">${r.duration || ''} &middot; ${timeAgo(r.started || r.timestamp)}</span>
        </div>
      `).join('');
    });

    roster.appendChild(card);
  });
}

/* ================================================================
   SCHEDULER PANEL
   ================================================================ */
async function loadScheduler() {
  let data;
  try {
    data = await fetchJSON('/api/scheduler');
  } catch {
    data = { jobs: [], total: 0 };
  }

  const jobs = data.jobs || [];
  const grid = document.getElementById('scheduler-grid');

  if (jobs.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#128197;</div><h3>No scheduler jobs</h3><p>No scheduled jobs found in the control plane</p></div>';
    return;
  }

  grid.innerHTML = '';
  // Sort: enabled first, then by schedule frequency
  const sorted = [...jobs].sort((a, b) => {
    if (a.enabled !== b.enabled) return a.enabled ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });

  sorted.forEach((job, i) => {
    const card = document.createElement('div');
    card.className = 'glass job-card';
    card.style.animationDelay = (i * 60) + 'ms';
    card.style.animation = 'fadeIn 0.4s ease forwards';

    const enabled = job.enabled !== false;
    const schedule = job.schedule || job.cron || 'unknown';
    const prompt = job.prompt || job.task || '';
    const agentId = job.agent_id || job.agent || 'default';
    const lastRun = job.last_run || job.last_ran || '';
    const nextRun = job.next_run || '';
    const runCount = job.run_count || 0;

    card.innerHTML = `
      <div class="job-glow"></div>
      <div class="job-header">
        <span style="font-size:1.2rem">&#128337;</span>
        <span class="job-name">${job.name || 'unnamed'}</span>
        <span class="job-schedule">${schedule}</span>
        <span class="job-status ${enabled ? 'enabled' : 'disabled'}">
          <span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>
          ${enabled ? 'Active' : 'Disabled'}
        </span>
      </div>
      ${prompt ? `<div class="job-prompt" id="prompt-${i}">${escapeHtml(prompt)}</div>
      <button class="job-expand-btn" onclick="togglePrompt(${i})">Show more</button>` : ''}
      <div class="job-meta">
        <span>Agent: <span class="val">${agentId}</span></span>
        <span>Runs: <span class="val">${runCount}</span></span>
        ${lastRun ? `<span>Last: <span class="val">${timeAgo(lastRun)}</span></span>` : ''}
        ${nextRun ? `<span>Next: <span class="val">${timeAgo(nextRun)}</span></span>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });
}

function togglePrompt(idx) {
  const el = document.getElementById('prompt-' + idx);
  if (!el) return;
  el.classList.toggle('expanded');
  const btn = el.nextElementSibling;
  if (btn) btn.textContent = el.classList.contains('expanded') ? 'Show less' : 'Show more';
}

/* ================================================================
   INIT
   ================================================================ */
loadPanelData('overview');
</script>
