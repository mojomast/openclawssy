<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>openclawssy dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:       #0a0a0f;
  --surface:  rgba(255,255,255,0.03);
  --border:   rgba(255,255,255,0.08);
  --text:     #e2e8f0;
  --text-dim: #94a3b8;
  --text-xs:  #64748b;
  --primary:  #7c3aed;
  --secondary:#06b6d4;
  --tertiary: #f59e0b;
  --accent-pink: #ec4899;
  --accent-green:#22c55e;
  --accent-orange:#f97316;
  --radius:   12px;
  --glass-bg: rgba(255,255,255,0.03);
  --glass-blur: blur(12px);
  --glass-border: 1px solid rgba(255,255,255,0.08);
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ============================================================
   ANIMATED GRADIENT BACKGROUND
   ============================================================ */
#bg-gradient {
  position: fixed; inset: 0; z-index: -2;
  background: linear-gradient(135deg, #0a0a0f 0%, #0f0a1a 33%, #0a0f1a 66%, #0a0a0f 100%);
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  25%  { background-position: 100% 0%; }
  50%  { background-position: 100% 100%; }
  75%  { background-position: 0% 100%; }
  100% { background-position: 0% 50%; }
}

/* ============================================================
   PARTICLE CANVAS
   ============================================================ */
#particles {
  position: fixed; inset: 0; z-index: -1;
  pointer-events: none;
  opacity: 0.35;
}

/* ============================================================
   GLASS CARD
   ============================================================ */
.glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: var(--glass-border);
  border-radius: var(--radius);
}

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(124,58,237,0.5); }

/* ============================================================
   HEADER
   ============================================================ */
.header {
  position: sticky; top: 0; z-index: 100;
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  gap: 2rem;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: var(--text);
}
.logo .claw { color: var(--primary); }
.logo svg { width: 28px; height: 28px; }

/* ============================================================
   TAB NAVIGATION
   ============================================================ */
.tabs {
  display: flex;
  align-items: center;
  gap: 0;
  position: relative;
  height: 100%;
  flex: 1;
}
.tab-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0 1.2rem;
  height: 100%;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--primary); }
.tab-indicator {
  position: absolute;
  bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 1px;
  transition: left 0.35s cubic-bezier(0.4,0,0.2,1), width 0.35s cubic-bezier(0.4,0,0.2,1);
}

.header-right {
  display: flex; align-items: center; gap: 1rem; margin-left: auto;
}
.header-badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.2rem 0.6rem;
  border-radius: 9999px;
  background: rgba(124,58,237,0.15);
  color: var(--primary);
  border: 1px solid rgba(124,58,237,0.25);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main {
  padding: 1.5rem 2rem 3rem;
  max-width: 1600px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
.panel { display: none; animation: fadeIn 0.4s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

/* ============================================================
   PROVENANCE BAR
   ============================================================ */
.provenance-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.5rem;
  padding: 0.75rem 1rem;
  margin-bottom: 1.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}
.provenance-bar span { display:flex; align-items:center; gap:0.3rem; }
.provenance-bar .label { color: var(--text-xs); }

/* ============================================================
   STAT CARDS GRID
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.stat-card {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.stat-card:hover {
  border-color: rgba(124,58,237,0.2);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(124,58,237,0.08);
}
.stat-card .icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  margin-bottom: 0.25rem;
}
.stat-card .count {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-card .label {
  font-size: 0.8rem;
  color: var(--text-dim);
  font-weight: 500;
}
.stat-card .glow {
  position: absolute;
  top: -40px; right: -40px;
  width: 100px; height: 100px;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.15;
  pointer-events: none;
}

/* ============================================================
   RECENT ACTIVITY
   ============================================================ */
.section-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.section-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

.activity-list { display: flex; flex-direction: column; gap: 0.5rem; }
.activity-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 1rem;
  transition: var(--transition);
  cursor: default;
}
.activity-item:hover {
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.12);
}
.activity-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.activity-info { flex: 1; min-width: 0; }
.activity-name {
  font-weight: 600;
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.activity-path {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-xs);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.activity-time {
  font-size: 0.7rem;
  color: var(--text-xs);
  white-space: nowrap;
  flex-shrink: 0;
}

/* ============================================================
   SKELETON LOADING
   ============================================================ */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-card { height: 140px; }
.skeleton-line { height: 16px; margin-bottom: 8px; }
.skeleton-line.w60 { width: 60%; }
.skeleton-line.w40 { width: 40%; }
.skeleton-line.w80 { width: 80%; }

/* ============================================================
   GRAPH VIEW
   ============================================================ */
.graph-container {
  position: relative;
  width: 100%;
  height: calc(100vh - 72px);
  border-radius: var(--radius);
  overflow: hidden;
}
.graph-container svg { width: 100%; height: 100%; }
/* When graph panel is active, expand main to full width */
.main:has(#panel-graph.active) {
  max-width: 100%;
  padding: 0.25rem 0.5rem 0.25rem;
}
.graph-toolbar {
  position: absolute;
  top: 1rem; left: 1rem;
  display: flex;
  gap: 0.5rem;
  z-index: 10;
}
.graph-search {
  padding: 0.5rem 1rem;
  border-radius: 8px;
  border: var(--glass-border);
  background: rgba(10,10,15,0.9);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.8rem;
  outline: none;
  width: 260px;
  backdrop-filter: blur(10px);
  transition: var(--transition);
}
.graph-search:focus { border-color: var(--primary); }
.graph-search::placeholder { color: var(--text-xs); }
.graph-btn {
  padding: 0.5rem 0.8rem;
  border-radius: 8px;
  border: var(--glass-border);
  background: rgba(10,10,15,0.9);
  color: var(--text-dim);
  font-size: 0.8rem;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: var(--transition);
}
.graph-btn:hover { color: var(--text); border-color: var(--primary); }
.graph-toggle {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.35rem 0.8rem;
  border-radius: 8px;
  border: var(--glass-border);
  background: rgba(10,10,15,0.9);
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: var(--transition);
  user-select: none;
}
.graph-toggle:hover { color: var(--text); border-color: var(--primary); }
.graph-toggle input { accent-color: var(--accent); cursor: pointer; }
.toggle-label { pointer-events: none; }
.graph-badge {
  padding: 0.25rem 0.6rem;
  border-radius: 8px;
  background: rgba(124,58,237,0.15);
  color: var(--text-dim);
  font-size: 0.7rem;
  font-family: var(--mono);
  white-space: nowrap;
}

.graph-sidebar {
  position: absolute;
  top: 1rem; right: 1rem; bottom: 1rem;
  width: 480px;
  padding: 1.5rem;
  z-index: 10;
  overflow-y: auto;
  transform: translateX(500px);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  background: rgba(10, 10, 18, 0.92) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.graph-sidebar.open { transform: translateX(0); }
.graph-sidebar h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.graph-sidebar .close-btn {
  margin-left: auto;
  background: none; border: none;
  color: var(--text-dim); cursor: pointer;
  font-size: 1.1rem;
  transition: var(--transition);
}
.graph-sidebar .close-btn:hover { color: var(--text); }
.detail-row {
  display: flex; justify-content: space-between;
  padding: 0.4rem 0;
  font-size: 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.detail-row .key { color: var(--text-dim); }
.detail-row .val { color: var(--text); font-weight: 500; text-align: right; max-width: 60%; word-break: break-all; }

.sidebar-section {
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.sidebar-section-title {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.6rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.sidebar-file-content {
  max-height: 400px;
  overflow-y: auto;
  border-radius: 8px;
  background: rgba(0,0,0,0.5);
  padding: 1rem;
  font-size: 0.8rem;
  line-height: 1.6;
}
.sidebar-file-content pre {
  margin: 0.5em 0;
  padding: 0.75rem;
  border-radius: 6px;
  background: rgba(0,0,0,0.4);
  overflow-x: auto;
}
.sidebar-file-content pre code { background: none; padding: 0; }
.sidebar-file-content h1, .sidebar-file-content h2, .sidebar-file-content h3,
.sidebar-file-content h4 { margin: 0.8em 0 0.4em; font-weight: 700; }
.sidebar-file-content h1 { font-size: 1.2rem; }
.sidebar-file-content h2 { font-size: 1.05rem; }
.sidebar-file-content h3 { font-size: 0.95rem; }
.sidebar-file-content p { margin-bottom: 0.6em; }
.sidebar-file-content code {
  font-family: var(--mono);
  background: rgba(255,255,255,0.06);
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.85em;
}
.sidebar-file-content ul, .sidebar-file-content ol {
  padding-left: 1.5em;
  margin-bottom: 0.6em;
}
.sidebar-file-content blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 0.75rem;
  margin: 0.6em 0;
  color: var(--text-dim);
}
.sidebar-file-content a { color: var(--secondary); text-decoration: none; }
.sidebar-file-content a:hover { text-decoration: underline; }
.sidebar-file-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.5em 0;
  font-size: 0.8rem;
}
.sidebar-file-content th, .sidebar-file-content td {
  padding: 0.3rem 0.5rem;
  border: 1px solid var(--border);
  text-align: left;
}
.sidebar-file-content th { background: rgba(255,255,255,0.03); font-weight: 600; }

.sidebar-neighbor {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.6rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.78rem;
  transition: var(--transition);
  margin-bottom: 0.25rem;
}
.sidebar-neighbor:hover {
  background: rgba(124,58,237,0.12);
}
.sidebar-neighbor .nb-icon {
  flex-shrink: 0;
  font-size: 0.85rem;
}
.sidebar-neighbor .nb-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.sidebar-neighbor .nb-relation {
  font-size: 0.65rem;
  padding: 0.1rem 0.4rem;
  border-radius: 9999px;
  background: rgba(6,182,212,0.12);
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.sidebar-neighbor .nb-open-btn {
  flex-shrink: 0;
  background: none;
  border: 1px solid rgba(124,58,237,0.2);
  color: var(--primary);
  border-radius: 4px;
  padding: 0.15rem 0.4rem;
  font-size: 0.65rem;
  cursor: pointer;
  font-family: var(--font);
  transition: var(--transition);
}
.sidebar-neighbor .nb-open-btn:hover {
  background: rgba(124,58,237,0.15);
  border-color: var(--primary);
}

/* Chat message viewer in sidebar */
.sidebar-chat-viewer {
  max-height: 500px;
  overflow-y: auto;
  border-radius: 8px;
  background: rgba(0,0,0,0.5);
  padding: 0.75rem;
}
.chat-message {
  margin-bottom: 0.75rem;
  padding: 0.6rem 0.8rem;
  border-radius: 8px;
  font-size: 0.8rem;
  line-height: 1.5;
  word-wrap: break-word;
}
.chat-message.user {
  background: rgba(124,58,237,0.15);
  border-left: 3px solid var(--primary);
}
.chat-message.assistant {
  background: rgba(6,182,212,0.1);
  border-left: 3px solid var(--secondary);
}
.chat-message .msg-role {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.25rem;
}
.chat-message.user .msg-role { color: var(--primary); }
.chat-message.assistant .msg-role { color: var(--secondary); }
.chat-message .msg-time {
  font-size: 0.6rem;
  color: var(--text-xs);
  float: right;
  margin-top: 2px;
}
.chat-message .msg-content {
  color: var(--text);
  white-space: pre-wrap;
}
.chat-message .msg-content p { margin-bottom: 0.4em; }
.chat-message .msg-content code {
  font-family: var(--mono);
  background: rgba(255,255,255,0.06);
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.85em;
}
.chat-message .msg-content pre {
  margin: 0.5em 0;
  padding: 0.5rem;
  border-radius: 6px;
  background: rgba(0,0,0,0.4);
  overflow-x: auto;
}
.chat-message .msg-content pre code { background: none; padding: 0; }
.chat-no-messages {
  text-align: center;
  color: var(--text-dim);
  padding: 2rem 1rem;
  font-size: 0.8rem;
}

/* Tool call messages - collapsible */
.chat-message.tool {
  background: rgba(249,115,22,0.08);
  border-left: 3px solid var(--accent-orange);
  padding: 0;
  margin-bottom: 0.5rem;
}
.chat-message.tool .msg-role { color: var(--accent-orange); }
.chat-tool-summary {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.8rem;
  cursor: pointer;
  user-select: none;
  list-style: none;
  font-size: 0.75rem;
}
.chat-tool-summary::-webkit-details-marker { display: none; }
.chat-tool-summary::before {
  content: '\25B6';
  font-size: 0.55rem;
  color: var(--accent-orange);
  transition: transform 0.2s;
  flex-shrink: 0;
}
details[open] > .chat-tool-summary::before { transform: rotate(90deg); }
.chat-tool-name {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--accent-orange);
  font-size: 0.7rem;
}
.chat-tool-brief {
  color: var(--text-dim);
  font-size: 0.65rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.chat-tool-error {
  color: #ef4444;
  font-size: 0.65rem;
  font-weight: 600;
}
.chat-tool-detail {
  padding: 0.4rem 0.8rem 0.5rem;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 0.7rem;
}
.chat-tool-detail pre {
  margin: 0.3rem 0;
  padding: 0.5rem;
  border-radius: 6px;
  background: rgba(0,0,0,0.4);
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.65rem;
  line-height: 1.4;
  color: var(--text-dim);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 300px;
  overflow-y: auto;
}
.chat-tool-detail .tool-label {
  font-size: 0.6rem;
  color: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 0.4rem;
  margin-bottom: 0.15rem;
}

/* Floating file viewer panels for multi-file comparison */
.floating-panel {
  position: absolute;
  width: 500px;
  max-height: 70vh;
  background: rgba(10,10,18,0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(124,58,237,0.2);
  border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 1px rgba(124,58,237,0.3);
  z-index: 15;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: floatIn 0.3s cubic-bezier(0.4,0,0.2,1);
  resize: both;
  min-width: 320px;
  min-height: 200px;
}
@keyframes floatIn { from { opacity:0; transform:scale(0.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
.floating-panel-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 1rem;
  background: rgba(124,58,237,0.15);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  cursor: move;
  user-select: none;
  flex-shrink: 0;
}
.floating-panel-header .fp-icon { font-size: 1rem; }
.floating-panel-header .fp-title {
  font-weight: 600;
  font-size: 0.85rem;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.floating-panel-header .fp-badge {
  font-size: 0.6rem;
  padding: 0.1rem 0.4rem;
  border-radius: 9999px;
  font-weight: 600;
  text-transform: uppercase;
}
.floating-panel-header .fp-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0 0.2rem;
  transition: var(--transition);
  line-height: 1;
}
.floating-panel-header .fp-close:hover { color: #ef4444; }
.floating-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  font-size: 0.8rem;
  line-height: 1.6;
}
/* Reuse sidebar-file-content styles for floating panel body */
.floating-panel-body pre {
  margin: 0.5em 0;
  padding: 0.75rem;
  border-radius: 6px;
  background: rgba(0,0,0,0.4);
  overflow-x: auto;
}
.floating-panel-body pre code { background: none; padding: 0; }
.floating-panel-body h1, .floating-panel-body h2, .floating-panel-body h3,
.floating-panel-body h4 { margin: 0.8em 0 0.4em; font-weight: 700; }
.floating-panel-body h1 { font-size: 1.2rem; }
.floating-panel-body h2 { font-size: 1.05rem; }
.floating-panel-body h3 { font-size: 0.95rem; }
.floating-panel-body p { margin-bottom: 0.6em; }
.floating-panel-body code {
  font-family: var(--mono);
  background: rgba(255,255,255,0.06);
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.85em;
}
.floating-panel-body ul, .floating-panel-body ol { padding-left: 1.5em; margin-bottom: 0.6em; }
.floating-panel-body blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 0.75rem;
  margin: 0.6em 0;
  color: var(--text-dim);
}
.floating-panel-body a { color: var(--secondary); text-decoration: none; }
.floating-panel-body a:hover { text-decoration: underline; }
.floating-panel-body table { width: 100%; border-collapse: collapse; margin: 0.5em 0; font-size: 0.8rem; }
.floating-panel-body th, .floating-panel-body td { padding: 0.3rem 0.5rem; border: 1px solid var(--border); text-align: left; }
.floating-panel-body th { background: rgba(255,255,255,0.03); font-weight: 600; }
.floating-panel-meta {
  padding: 0.5rem 1rem;
  background: rgba(0,0,0,0.4);
  border-top: 1px solid rgba(255,255,255,0.04);
  font-size: 0.7rem;
  color: var(--text-dim);
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.floating-panel-meta span { display: flex; align-items: center; gap: 0.25rem; }
.floating-panel-meta .val { color: var(--text); font-weight: 500; }

/* Graph legend */
.graph-legend {
  position: absolute;
  bottom: 1rem;
  left: 1rem;
  display: flex;
  gap: 0.75rem;
  padding: 0.5rem 0.85rem;
  border-radius: 8px;
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(10px);
  border: var(--glass-border);
  z-index: 10;
  font-size: 0.7rem;
  color: var(--text-dim);
}
.graph-legend-item {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
}
.legend-shape {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid;
}
.legend-shape.hexagon { border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
.legend-shape.diamond { transform: rotate(45deg); border-radius: 1px; width: 8px; height: 8px; }
.legend-shape.square { border-radius: 2px; }

.tooltip-graph {
  position: absolute;
  pointer-events: none;
  padding: 0.5rem 0.75rem;
  border-radius: 8px;
  background: rgba(10,10,15,0.95);
  border: 1px solid rgba(124,58,237,0.3);
  font-size: 0.75rem;
  z-index: 20;
  display: none;
  backdrop-filter: blur(8px);
  max-width: 300px;
}
.tooltip-graph .tt-name { font-weight: 600; margin-bottom: 2px; }
.tooltip-graph .tt-type { color: var(--text-dim); font-size: 0.7rem; }

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline-container { max-width: 800px; margin: 0 auto; }
.timeline-line {
  position: relative;
  padding-left: 2.5rem;
}
.timeline-line::before {
  content: '';
  position: absolute;
  left: 0.75rem;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--primary), var(--secondary), var(--tertiary));
  opacity: 0.3;
  border-radius: 1px;
}
.timeline-entry {
  position: relative;
  padding: 1rem 1.25rem;
  margin-bottom: 0.75rem;
  animation: slideInLeft 0.5s ease;
}
@keyframes slideInLeft { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }

.timeline-entry::before {
  content: '';
  position: absolute;
  left: -2rem;
  top: 1.4rem;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  background: var(--bg);
}
.timeline-entry.cat-markdown::before { border-color: var(--secondary); }
.timeline-entry.cat-code::before { border-color: var(--accent-green); }
.timeline-entry.cat-text::before { border-color: var(--tertiary); }
.timeline-entry.cat-directory::before { border-color: var(--accent-pink); }
.timeline-entry:hover {
  border-color: rgba(124,58,237,0.2);
  transform: translateX(4px);
}

.tl-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
.tl-icon { font-size: 1rem; }
.tl-name { font-weight: 600; font-size: 0.9rem; }
.tl-badge {
  font-size: 0.65rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tl-badge.markdown { background: rgba(6,182,212,0.15); color: var(--secondary); }
.tl-badge.code { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.tl-badge.text { background: rgba(245,158,11,0.15); color: var(--tertiary); }
.tl-badge.directory { background: rgba(236,72,153,0.15); color: var(--accent-pink); }

.tl-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; font-size: 0.75rem; color: var(--text-dim); }
.tl-meta span { display: flex; align-items: center; gap: 0.3rem; }

/* ============================================================
   ARTIFACT INSPECTOR
   ============================================================ */
.inspector-layout {
  display: grid;
  grid-template-columns: 280px 1fr 260px;
  gap: 1rem;
  height: calc(100vh - 140px);
}
.file-tree-panel {
  padding: 1rem;
  overflow-y: auto;
  height: 100%;
}
.file-tree-panel h3 {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tree-search {
  width: 100%;
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  border: var(--glass-border);
  background: rgba(255,255,255,0.02);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.8rem;
  outline: none;
  margin-bottom: 0.75rem;
  transition: var(--transition);
}
.tree-search:focus { border-color: var(--primary); }
.tree-search::placeholder { color: var(--text-xs); }

.tree-node {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.4rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: var(--transition);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-node:hover { background: rgba(255,255,255,0.04); }
.tree-node.selected { background: rgba(124,58,237,0.15); color: var(--primary); }
.tree-node .arrow {
  width: 16px; text-align: center;
  font-size: 0.6rem; color: var(--text-xs);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.tree-node .arrow.open { transform: rotate(90deg); }
.tree-children { padding-left: 1rem; }
.tree-children.collapsed { display: none; }

.content-panel {
  padding: 1.5rem;
  overflow-y: auto;
  height: 100%;
}
.content-panel .content-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.content-panel .content-title {
  font-size: 1.1rem;
  font-weight: 700;
}
.content-panel .content-body { line-height: 1.7; }
.content-panel .content-body h1,
.content-panel .content-body h2,
.content-panel .content-body h3,
.content-panel .content-body h4 { margin: 1.2em 0 0.6em; font-weight: 700; }
.content-panel .content-body h1 { font-size: 1.5rem; }
.content-panel .content-body h2 { font-size: 1.25rem; }
.content-panel .content-body h3 { font-size: 1.1rem; }
.content-panel .content-body p { margin-bottom: 0.8em; }
.content-panel .content-body code {
  font-family: var(--mono);
  background: rgba(255,255,255,0.06);
  padding: 0.15em 0.4em;
  border-radius: 4px;
  font-size: 0.85em;
}
.content-panel .content-body pre {
  margin: 1em 0;
  padding: 1rem;
  border-radius: 8px;
  background: rgba(0,0,0,0.4);
  overflow-x: auto;
}
.content-panel .content-body pre code {
  background: none;
  padding: 0;
}
.content-panel .content-body ul,
.content-panel .content-body ol {
  padding-left: 1.5em;
  margin-bottom: 0.8em;
}
.content-panel .content-body blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 1rem;
  margin: 1em 0;
  color: var(--text-dim);
}
.content-panel .content-body a { color: var(--secondary); text-decoration: none; }
.content-panel .content-body a:hover { text-decoration: underline; }
.content-panel .content-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
}
.content-panel .content-body th,
.content-panel .content-body td {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  text-align: left;
  font-size: 0.85rem;
}
.content-panel .content-body th {
  background: rgba(255,255,255,0.03);
  font-weight: 600;
}

.raw-content {
  font-family: var(--mono);
  font-size: 0.8rem;
  white-space: pre-wrap;
  color: var(--text-dim);
  line-height: 1.6;
}

.meta-panel {
  padding: 1rem;
  overflow-y: auto;
  height: 100%;
}
.meta-panel h3 {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.meta-row {
  padding: 0.5rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.meta-row .mk { font-size: 0.7rem; color: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
.meta-row .mv { font-size: 0.8rem; font-weight: 500; word-break: break-all; }
.meta-row .mv.mono { font-family: var(--mono); font-size: 0.75rem; }

/* ============================================================
   PROVENANCE PANEL
   ============================================================ */
.prov-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.prov-card {
  padding: 1.25rem;
}
.prov-card h4 {
  font-size: 0.75rem;
  color: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.75rem;
}
.prov-val {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--secondary);
  word-break: break-all;
}

.agent-roster {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.75rem;
}
.agent-card {
  padding: 1rem;
  cursor: pointer;
  transition: var(--transition);
}
.agent-card:hover {
  border-color: rgba(124,58,237,0.2);
  transform: translateY(-1px);
}
.agent-card.expanded {
  grid-column: 1 / -1;
}
.agent-name {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.agent-name .agent-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
}
.agent-counts {
  display: flex;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}
.agent-counts span { display: flex; align-items: center; gap: 0.3rem; }
.agent-detail {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: none;
}
.agent-card.expanded .agent-detail { display: block; }
.run-item {
  display: flex;
  justify-content: space-between;
  padding: 0.4rem 0;
  font-size: 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.run-item .run-id { font-family: var(--mono); color: var(--secondary); font-size: 0.75rem; }
.run-item .run-time { color: var(--text-dim); }

/* ============================================================
   EMPTY / ERROR STATES
   ============================================================ */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
.empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.85rem; }
.error-state { color: #ef4444; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1200px) {
  .inspector-layout { grid-template-columns: 240px 1fr; }
  .meta-panel { display: none; }
}
@media (max-width: 900px) {
  .header { padding: 0 1rem; gap: 0.5rem; }
  .main { padding: 1rem; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .inspector-layout { grid-template-columns: 1fr; }
  .file-tree-panel { height: auto; max-height: 250px; }
  .content-panel { height: auto; }
  .graph-sidebar { width: 360px; }
  .tab-btn { padding: 0 0.6rem; font-size: 0.8rem; }
}
@media (max-width: 600px) {
  .stat-grid { grid-template-columns: 1fr; }
  .agent-roster { grid-template-columns: 1fr; }
  .prov-grid { grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; }
}

/* ============================================================
   SCHEDULER
   ============================================================ */
.scheduler-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}
.job-card {
  padding: 1.25rem;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.job-card:hover {
  border-color: rgba(245,158,11,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(245,158,11,0.08);
}
.job-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.job-name {
  font-weight: 700;
  font-size: 0.95rem;
  flex: 1;
}
.job-schedule {
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 0.2rem 0.5rem;
  border-radius: 6px;
  background: rgba(245,158,11,0.12);
  color: var(--tertiary);
  white-space: nowrap;
}
.job-status {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
}
.job-status.enabled {
  background: rgba(34,197,94,0.12);
  color: var(--accent-green);
}
.job-status.disabled {
  background: rgba(239,68,68,0.12);
  color: #ef4444;
}
.job-prompt {
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 0.75rem;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.job-prompt.expanded {
  -webkit-line-clamp: unset;
  max-height: none;
}
.job-expand-btn {
  background: none;
  border: none;
  color: var(--secondary);
  font-size: 0.75rem;
  cursor: pointer;
  padding: 0;
  margin-bottom: 0.75rem;
  font-family: var(--font);
}
.job-expand-btn:hover { text-decoration: underline; }
.job-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.2rem;
  font-size: 0.7rem;
  color: var(--text-xs);
  padding-top: 0.75rem;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.job-meta span {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.job-meta .val { color: var(--text-dim); font-weight: 500; }
.job-glow {
  position: absolute;
  top: -30px; right: -30px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--tertiary);
  filter: blur(40px);
  opacity: 0.08;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="bg-gradient"></div>
<canvas id="particles"></canvas>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14" stroke="#7c3aed" stroke-width="2" fill="none"/>
      <path d="M10 20 C10 14 14 10 16 10 C18 10 22 14 22 20" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="13" cy="15" r="1.5" fill="#7c3aed"/>
      <circle cx="19" cy="15" r="1.5" fill="#7c3aed"/>
      <path d="M12 22 C12 22 14 24 16 24 C18 24 20 22 20 22" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
    <span>open<span class="claw">clawssy</span></span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="graph">Graph</button>
    <button class="tab-btn" data-tab="timeline">Timeline</button>
    <button class="tab-btn" data-tab="scheduler">Scheduler</button>
    <button class="tab-btn" data-tab="inspector">Artifacts</button>
    <button class="tab-btn" data-tab="provenance">Provenance</button>
    <div class="tab-indicator" id="tab-indicator"></div>
  </nav>

  <div class="header-right">
    <span class="header-badge">GLM-5</span>
    <span class="header-badge" style="background:rgba(6,182,212,0.15);color:var(--secondary);border-color:rgba(6,182,212,0.25);">73 Agents</span>
  </div>
</header>

<!-- ============================================================
     PANELS
     ============================================================ -->
<main class="main">

  <!-- OVERVIEW -->
  <section class="panel active" id="panel-overview">
    <div class="provenance-bar glass" id="overview-provenance">
      <span><span class="label">Container:</span> loading...</span>
    </div>
    <div class="stat-grid" id="stat-grid">
      <div class="glass skeleton skeleton-card"></div>
      <div class="glass skeleton skeleton-card"></div>
      <div class="glass skeleton skeleton-card"></div>
      <div class="glass skeleton skeleton-card"></div>
      <div class="glass skeleton skeleton-card"></div>
    </div>
    <div class="section-title"><span class="dot"></span> Recent Activity</div>
    <div class="activity-list" id="activity-list">
      <div class="glass skeleton" style="height:56px;margin-bottom:6px"></div>
      <div class="glass skeleton" style="height:56px;margin-bottom:6px"></div>
      <div class="glass skeleton" style="height:56px;margin-bottom:6px"></div>
      <div class="glass skeleton" style="height:56px;margin-bottom:6px"></div>
      <div class="glass skeleton" style="height:56px;margin-bottom:6px"></div>
    </div>
  </section>

  <!-- GRAPH -->
  <section class="panel" id="panel-graph">
    <div class="graph-container glass" id="graph-container">
      <div class="graph-toolbar">
        <input type="text" class="graph-search" id="graph-search" placeholder="Search nodes...">
        <label class="graph-toggle" title="Show agent run nodes (may slow graph)">
          <input type="checkbox" id="graph-toggle-runs">
          <span class="toggle-label">Runs</span>
        </label>
        <label class="graph-toggle" title="Show node name labels">
          <input type="checkbox" id="graph-toggle-labels" checked>
          <span class="toggle-label">Labels</span>
        </label>
        <span class="graph-badge" id="graph-badge"></span>
        <button class="graph-btn" id="graph-reset" title="Reset zoom">&#8634;</button>
        <button class="graph-btn" id="graph-cluster" title="Toggle clustering">&#9881;</button>
      </div>
      <div class="tooltip-graph" id="graph-tooltip">
        <div class="tt-name"></div>
        <div class="tt-type"></div>
      </div>
      <div class="graph-sidebar glass" id="graph-sidebar">
        <h3>
          <span>Node Details</span>
          <button class="close-btn" id="sidebar-close">&times;</button>
        </h3>
        <div id="sidebar-details"></div>
      </div>
      <svg id="graph-svg"></svg>
      <div class="graph-legend" id="graph-legend">

/* ================================================================
   PARTICLE / CONSTELLATION BACKGROUND
   ================================================================ */
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], animId;
  const PARTICLE_COUNT = 60;
  const MAX_DIST = 140;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5,
      color: ['#7c3aed','#06b6d4','#f59e0b','#ec4899'][Math.floor(Math.random()*4)]
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < MAX_DIST) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = `rgba(124,58,237,${0.12 * (1 - dist/MAX_DIST)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(draw);
  }
  draw();
})();

/* ================================================================

function formatBytes(bytes) {
  if (bytes == null || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleString();
}

function fileIcon(name, type) {
  if (type === 'directory' || type === 'folder') return '&#128193;';
  if (type === 'agent') return '&#129302;';
  if (type === 'run') return '&#9654;&#65039;';
  if (type === 'chat_session') return '&#128172;';
  const ext = (name || '').split('.').pop().toLowerCase();
  if (['md','markdown'].includes(ext)) return '&#128220;';
  if (['go','js','ts','py','rb','rs','c','cpp','java','sh','bash','yml','yaml','json','toml','xml','html','css'].includes(ext)) return '&#128187;';
  if (['txt','text','log','csv'].includes(ext)) return '&#128196;';
  if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return '&#128248;';
  return '&#128196;';
}

function inferCategory(name, type) {
  if (type === 'directory' || type === 'folder') return 'directory';
  const ext = (name || '').split('.').pop().toLowerCase();
  if (['md','markdown'].includes(ext)) return 'markdown';
  if (['go','js','ts','py','rb','rs','c','cpp','java','sh','bash','yml','yaml','json','toml','xml','html','css','sql','Makefile','Dockerfile'].includes(ext)) return 'code';

}

  }
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function animateCounter(el, target, duration) {
  duration = duration || 1200;
  const start = performance.now();
  const initial = 0;
  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.floor(initial + (target - initial) * eased).toLocaleString();
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function generateFallbackGraph() {
  const folders = ['internal','runtime','tools','config','channels','dashboard','http','policy','instances','eval','cmd','docs','workspace','journal','ussystats','ussyflow','test2','hourly-apps'];
  const files = ['engine.go','store.go','handler.go','registry.go','server.go','config.go','main.go','policy.go','trace.go','model.go','parser.go','types.go','logger.go','events.go','pipeline.go','README.md','AGENTS.md','Makefile','Dockerfile','go.mod'];
  const agents = [];
  for (let i = 1; i <= 73; i++) agents.push('agent-' + String(i).padStart(3,'0'));

  const nodes = [];
  const edges = [];
  let id = 0;

  // folders
  folders.forEach((f,i) => {
    nodes.push({ id: 'folder-'+f, name: f, type: 'folder', group: f, size: 0 });
  });
  // files
  files.forEach((f,i) => {
    const parent = folders[i % folders.length];
    const sz = Math.floor(Math.random()*30000)+1000;
    nodes.push({ id: 'file-'+f, name: f, type: 'file', group: parent, size: sz });
    edges.push({ source: 'folder-'+parent, target: 'file-'+f, type: 'contains' });
  });
  // agents
  agents.forEach((a,i) => {
    nodes.push({ id: 'agent-'+a, name: a, type: 'agent', group: folders[i % 5], size: 0 });
    if (i < files.length) edges.push({ source: 'agent-'+a, target: 'file-'+files[i], type: 'generated_by' });
  });
  // some runs
  for (let i = 0; i < 20; i++) {
    const rId = 'run-' + (1000+i);
    nodes.push({ id: rId, name: 'Run #' + (1000+i), type: 'run', group: folders[i%5], size: 0 });
    edges.push({ source: 'agent-'+agents[i%agents.length], target: rId, type: 'generated_by' });
    if (i > 0) edges.push({ source: 'run-'+(1000+i-1), target: rId, type: 'temporal' });
  }
  // some sessions
  for (let i = 0; i < 10; i++) {
    const sId = 'session-' + (100+i);
    nodes.push({ id: sId, name: 'Session #'+(100+i), type: 'session', group: folders[i%5], size: 0 });
    edges.push({ source: 'agent-'+agents[i*7%agents.length], target: sId, type: 'session_link' });
  }
  // some references
  for (let i = 0; i < 15; i++) {
    const fi = i % files.length;
    const fj = (i+3) % files.length;
    if (fi !== fj) edges.push({ source: 'file-'+files[fi], target: 'file-'+files[fj], type: 'references' });
  }

  return { nodes, edges };
}

  } else if (ext === 'yml' || ext === 'yaml') {
    content = `# openclawssy configuration\nversion: "3.8"\n\nservices:\n  openclawssy:\n    build: .\n    container_name: openclawssy_agent_default\n    volumes:\n      - openclawssy_ws_default:/workspace\n    environment:\n      - OPENCLAWSSY_MODEL=glm-5\n      - OPENCLAWSSY_PROVIDER=zai\n    restart: unless-stopped\n\nvolumes:\n  openclawssy_ws_default:\n`;
  } else {
    content = `// ${name}\n// Part of the openclawssy workspace\n// Auto-generated preview content\n\nThis file contains workspace data for the openclawssy platform.\nInstance: default\nAgent: orchestrator\n`;
  }
  return {
    path: path,
    name: name,
    size: content.length,
    modified: new Date().toISOString(),
    type: ext,
    content: content,
    references: ext === 'go' ? ['internal/runtime/types.go','internal/config/config.go'] : []
  };
}

/* --- Floating file panels system --- */
const floatingPanels = new Map(); // path -> DOM element
let floatingZCounter = 16;

function openFloatingPanel(path) {
  if (floatingPanels.has(path)) {
    // Bring existing panel to front
    const panel = floatingPanels.get(path);
    panel.style.zIndex = ++floatingZCounter;
    return;
  }

  const container = document.getElementById('graph-container');
  const panel = document.createElement('div');
  panel.className = 'floating-panel';

  // Position with slight offset from existing panels
  const offset = floatingPanels.size * 30;
  panel.style.left = (200 + offset) + 'px';
  panel.style.top = (80 + offset) + 'px';
  panel.style.zIndex = ++floatingZCounter;

  const name = path.split('/').pop();
  const cat = inferCategory(name, 'file');

  panel.innerHTML = `
    <div class="floating-panel-header">
      <span class="fp-icon">${fileIcon(name, 'file')}</span>
      <span class="fp-title">${escapeHtml(name)}</span>
      <span class="fp-badge" style="background:${categoryColor(cat)}15;color:${categoryColor(cat)}">${cat}</span>
      <button class="fp-close" title="Close">&times;</button>
    </div>
    <div class="floating-panel-body">
      <div class="skeleton skeleton-line w80"></div>
      <div class="skeleton skeleton-line w60"></div>
      <div class="skeleton skeleton-line w80"></div>
    </div>
    <div class="floating-panel-meta"></div>
  `;

  // Close button
  panel.querySelector('.fp-close').addEventListener('click', () => {
    panel.remove();
    floatingPanels.delete(path);
  });

  // Make draggable via header
  makeDraggable(panel, panel.querySelector('.floating-panel-header'));

  // Bring to front on any click inside the panel
  panel.addEventListener('mousedown', () => {
    panel.style.zIndex = ++floatingZCounter;
  });

  container.appendChild(panel);
  floatingPanels.set(path, panel);

  // Load content asynchronously
  loadFloatingPanelContent(path, panel);
}

async function loadFloatingPanelContent(path, panel) {
  let data;
  try {
    data = await fetchJSON('/api/file?path=' + encodeURIComponent(path));
  } catch {
    panel.querySelector('.floating-panel-body').innerHTML =
      '<div style="color:var(--text-dim);padding:1rem">Failed to load file</div>';
    return;
  }

  const body = panel.querySelector('.floating-panel-body');
  const meta = panel.querySelector('.floating-panel-meta');
  const name = data.name || path.split('/').pop();
  const ext = name.split('.').pop().toLowerCase();
  const content = data.content || '';

  // Render content based on file type
  if (['md', 'markdown'].includes(ext)) {
    body.innerHTML = marked.parse(content);
  } else if (['go', 'js', 'ts', 'py', 'rb', 'rs', 'c', 'cpp', 'java', 'sh', 'bash',
               'yml', 'yaml', 'json', 'toml', 'xml', 'html', 'css', 'sql'].includes(ext)) {
    const lang = hljs.getLanguage(ext) ? ext : null;
    const highlighted = lang
      ? hljs.highlight(content, { language: lang }).value
      : hljs.highlightAuto(content).value;
    body.innerHTML = `<pre><code class="hljs">${highlighted}</code></pre>`;
  } else {
    body.innerHTML = `<pre style="white-space:pre-wrap">${escapeHtml(content)}</pre>`;
  }

  meta.innerHTML = `
    <span>Size: <span class="val">${formatBytes(data.size)}</span></span>
    <span>Modified: <span class="val">${formatDate(data.mtime_iso || data.modified)}</span></span>
    <span>Category: <span class="val">${data.category || ext}</span></span>
  `;
}

function makeDraggable(el, handle) {
  let startX, startY, startLeft, startTop;
  handle.addEventListener('mousedown', (e) => {
    if (e.target.closest('.fp-close')) return;
    e.preventDefault();
    startX = e.clientX;
    startY = e.clientY;
    const rect = el.getBoundingClientRect();
    const parentRect = el.parentElement.getBoundingClientRect();
    startLeft = rect.left - parentRect.left;
    startTop = rect.top - parentRect.top;
    el.style.zIndex = ++floatingZCounter;

    function onMove(ev) {
      el.style.left = (startLeft + ev.clientX - startX) + 'px';
      el.style.top = (startTop + ev.clientY - startY) + 'px';
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function buildSidebarMetadata(d, edges) {
  const name = d.name || d.label || d.id;
  const cat = d.category || inferCategory(name, d.type);
  const catCol = categoryColor(cat);

  // Count connections by type
  const connMap = {};
  let connTotal = 0;
  edges.forEach(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    if (sid === d.id || tid === d.id) {
      connTotal++;
      const t = e.type || 'unknown';
      connMap[t] = (connMap[t] || 0) + 1;
    }
  });

  const connSummary = Object.entries(connMap)
    .map(([t, c]) => `<span class="val" style="margin-right:6px">${c} ${t}</span>`)
    .join('');

  let html = `
    <div class="detail-row" style="align-items:center;gap:8px">
      <span style="font-size:1.3rem">${fileIcon(name, d.type)}</span>
      <span class="val" style="font-weight:700;font-size:0.95rem">${escapeHtml(name)}</span>
      <span style="background:${catCol}15;color:${catCol};padding:2px 8px;border-radius:6px;font-size:0.7rem;font-weight:600">${cat}</span>
    </div>
  `;

  if (d.path) {
    html += `<div class="detail-row"><span class="key">Path</span><span class="val" style="font-family:var(--mono);font-size:0.7rem;word-break:break-all">${escapeHtml(d.path)}</span></div>`;
  }

  html += `<div class="detail-row"><span class="key">Type</span><span class="val">${d.type}</span></div>`;

  if (d.size) {
    html += `<div class="detail-row"><span class="key">Size</span><span class="val">${formatBytes(d.size)}</span></div>`;
  }

  if (d.mtime_iso || d.mtime) {
    html += `<div class="detail-row"><span class="key">Modified</span><span class="val">${formatDate(d.mtime_iso || d.mtime)} (${timeAgo(d.mtime_iso || d.mtime)})</span></div>`;
  }

  html += `<div class="detail-row"><span class="key">Category</span><span class="val" style="color:${catCol}">${cat}</span></div>`;
  html += `<div class="detail-row"><span class="key">Connections</span><span class="val">${connTotal}</span></div>`;

  if (connSummary) {
    html += `<div class="detail-row" style="flex-wrap:wrap">${connSummary}</div>`;
  }

  // Agent-specific metadata
  if (d.type === 'agent') {
    if (d.run_count != null) {
      html += `<div class="detail-row"><span class="key">Runs</span><span class="val">${d.run_count}</span></div>`;
    }
    if (d.chat_session_count != null) {
      html += `<div class="detail-row"><span class="key">Sessions</span><span class="val">${d.chat_session_count}</span></div>`;
    }
  }

  // Run-specific metadata
  if (d.type === 'run') {
    if (d.agent) html += `<div class="detail-row"><span class="key">Agent</span><span class="val">${escapeHtml(d.agent)}</span></div>`;
    if (d.status) html += `<div class="detail-row"><span class="key">Status</span><span class="val">${d.status}</span></div>`;
    if (d.model) html += `<div class="detail-row"><span class="key">Model</span><span class="val">${escapeHtml(d.model)}</span></div>`;
    if (d.duration) html += `<div class="detail-row"><span class="key">Duration</span><span class="val">${d.duration}</span></div>`;
  }

  // Chat session metadata
  if (d.type === 'chat_session') {
    if (d.agent) html += `<div class="detail-row"><span class="key">Agent</span><span class="val">${escapeHtml(d.agent)}</span></div>`;
    html += `<div class="detail-row"><span class="key">Node Type</span><span class="val" style="color:var(--secondary)">Chat Session</span></div>`;
  }

  html += `<div class="detail-row"><span class="key">ID</span><span class="val" style="font-family:var(--mono);font-size:0.7rem">${escapeHtml(d.id)}</span></div>`;

  return html;
}

function renderChatMessage(msg) {
  if (msg.role === 'tool') {
    // Collapsible tool call
    const toolName = msg.tool_name || 'unknown tool';
    const hasError = msg.error && msg.error.length > 0;
    const brief = hasError
      ? `<span class="chat-tool-error">Error: ${escapeHtml(msg.error)}</span>`
      : `<span class="chat-tool-brief">${escapeHtml((msg.summary || '').substring(0, 80))}</span>`;
    
    // Pretty-print the output if it's JSON
    let outputDisplay = msg.output || '';
    try {
      const parsed = JSON.parse(outputDisplay);
      outputDisplay = JSON.stringify(parsed, null, 2);
    } catch { /* keep as-is */ }

    let detailHtml = '';
    if (msg.summary) {
      detailHtml += `<div class="tool-label">Summary</div><pre>${escapeHtml(msg.summary)}</pre>`;
    }
    if (outputDisplay) {
      detailHtml += `<div class="tool-label">Output</div><pre>${escapeHtml(outputDisplay)}</pre>`;
    }
    if (hasError) {
      detailHtml += `<div class="tool-label">Error</div><pre style="color:#ef4444">${escapeHtml(msg.error)}</pre>`;
    }

    return `<div class="chat-message tool">
      <details>
        <summary class="chat-tool-summary">
          <span class="chat-tool-name">${escapeHtml(toolName)}</span>
          ${brief}
        </summary>
        <div class="chat-tool-detail">${detailHtml}</div>
      </details>
    </div>`;
  }

  // User or assistant message
  const roleClass = msg.role === 'user' ? 'user' : 'assistant';
  const roleLabel = msg.role === 'user' ? 'You' : 'Assistant';
  const timeStr = msg.ts ? formatDate(msg.ts) : '';
  let rendered = escapeHtml(msg.content || '');
  rendered = rendered.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  rendered = rendered.replace(/`([^`]+)`/g, '<code>$1</code>');
  rendered = rendered.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  rendered = rendered.replace(/\n/g, '<br>');

  return `<div class="chat-message ${roleClass}">
    <span class="msg-time">${timeStr}</span>
    <div class="msg-role">${roleLabel}</div>
    <div class="msg-content">${rendered}</div>
  </div>`;
}

      <div class="skeleton skeleton-line w60"></div>
      <div class="skeleton skeleton-line w80"></div>
    </div>
  `;
  container.appendChild(chatSection);

  try {
    const data = await fetchJSON('/api/chat/' + encodeURIComponent(sessionId) + '/messages?limit=200');
    const viewer = chatSection.querySelector('.sidebar-chat-viewer');

    if (!data.messages || data.messages.length === 0) {
      viewer.innerHTML = '<div class="chat-no-messages">No messages in this session</div>';
      return;
    }

    // Show message count header
    let headerHtml = `<div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid rgba(255,255,255,0.06)">`;
    headerHtml += `Showing ${data.shown_messages} of ${data.total_messages} messages`;
    if (data.channel) headerHtml += ` &middot; <span style="color:var(--text-xs)">${escapeHtml(data.channel)}</span>`;
    headerHtml += `</div>`;

    const msgsHtml = data.messages.map(renderChatMessage).join('');

    viewer.innerHTML = headerHtml + msgsHtml;

    // Auto-scroll to bottom (most recent messages)
    viewer.scrollTop = viewer.scrollHeight;
  } catch {
    chatSection.querySelector('.sidebar-chat-viewer').innerHTML =
      '<div class="chat-no-messages">Could not load chat messages</div>';
  }
}

/* --- Main graph loader --- */

async function loadGraph(includeRuns) {
  if (includeRuns === undefined) {
    includeRuns = document.getElementById('graph-toggle-runs')?.checked || false;
  }
  const url = '/api/graph' + (includeRuns ? '?include_runs=true' : '');
  try {
    graphData = await fetchJSON(url);
  } catch {
    graphData = generateFallbackGraph();
  }

  const container = document.getElementById('graph-container');
  const svg = d3.select('#graph-svg');
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Clean up any existing floating panels on reload
  floatingPanels.forEach((panel) => panel.remove());
  floatingPanels.clear();

  svg.selectAll('*').remove();

  const defs = svg.append('defs');
  // Arrow marker for references
  defs.append('marker')
    .attr('id', 'arrow-ref')
    .attr('viewBox', '0 0 10 10')
    .attr('refX', 20).attr('refY', 5)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,0 L10,5 L0,10 Z')
    .attr('fill', '#3b82f6');

  const g = svg.append('g');

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.15, 5])
    .on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(zoom);

  document.getElementById('graph-reset').addEventListener('click', () => {
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
  });

  const nodes = graphData.nodes || [];
  const edges = graphData.edges || [];

  // Update badge
  const badge = document.getElementById('graph-badge');
  if (badge) badge.textContent = `${nodes.length} nodes \u00b7 ${edges.length} edges`;

  // Node type -> visual properties
  const typeConfig = {
    folder:       { color: '#3b82f6', shape: 'circle', r: 14 },
    file:         { color: '#22c55e', shape: 'circle', r: 6 },
    agent:        { color: '#7c3aed', shape: 'hexagon', r: 16 },
    run:          { color: '#f97316', shape: 'diamond', r: 5 },
    chat_session: { color: '#06b6d4', shape: 'square', r: 5 },
  };

  // Edge type -> visual properties
  const edgeConfig = {
    contains:     { stroke: '#4b5563', dash: '', width: 1, opacity: 0.4 },
    references:   { stroke: '#3b82f6', dash: '6,3', width: 1.5, opacity: 0.6 },
    generated_by: { stroke: '#f97316', dash: '3,3', width: 1.2, opacity: 0.5 },
    temporal:     { stroke: '#6b7280', dash: '', width: 0.7, opacity: 0.25 },
    session_link: { stroke: '#ec4899', dash: '', width: 1.2, opacity: 0.5 },
  };

  // Cluster groups
  const groups = [...new Set(nodes.map(n => n.group).filter(Boolean))];
  const groupCenters = {};
  const cols = Math.ceil(Math.sqrt(groups.length));
  groups.forEach((gr, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    groupCenters[gr] = {
      x: (col + 0.5) * (width / cols),
      y: (row + 0.5) * (height / Math.ceil(groups.length / cols))
    };
  });

  // Simulation — tune forces based on graph size
  const isLarge = nodes.length > 500;
  graphSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id)
      .distance(d => {
        if (d.type === 'contains') return isLarge ? 30 : 50;
        if (d.type === 'session_link' || d.type === 'temporal') return isLarge ? 20 : 35;
        return isLarge ? 50 : 80;
      })
      .strength(d => {
        if (d.type === 'contains') return isLarge ? 0.3 : 0.5;
        if (d.type === 'session_link' || d.type === 'temporal') return isLarge ? 0.1 : 0.15;
        return isLarge ? 0.2 : 0.4;
      }))
    .force('charge', d3.forceManyBody()
      .strength(d => {
        if (d.type === 'agent') return isLarge ? -80 : -200;
        if (d.type === 'folder') return isLarge ? -60 : -150;
        return isLarge ? -30 : -80;
      })
      .distanceMax(isLarge ? 250 : 500))
    .force('center', d3.forceCenter(width / 2, height / 2)
      .strength(0.03))
    .force('collision', d3.forceCollide()
      .radius(d => (typeConfig[d.type]?.r || 8) + (isLarge ? 3 : 6)))
    .force('cluster', alpha => {
      nodes.forEach(n => {
        const c = groupCenters[n.group];
        if (c) {
          n.vx += (c.x - n.x) * alpha * 0.05;
          n.vy += (c.y - n.y) * alpha * 0.05;
        }
      });
    })
    .alphaDecay(0.02)
    .velocityDecay(0.4);

  // Draw edges
  const link = g.append('g').selectAll('line')
    .data(edges)
    .join('line')
    .attr('stroke', d => (edgeConfig[d.type] || edgeConfig.contains).stroke)
    .attr('stroke-dasharray', d => (edgeConfig[d.type] || edgeConfig.contains).dash)
    .attr('stroke-width', d => (edgeConfig[d.type] || edgeConfig.contains).width)
    .attr('opacity', d => (edgeConfig[d.type] || edgeConfig.contains).opacity)
    .attr('marker-end', d => d.type === 'references' ? 'url(#arrow-ref)' : '');

  // Shape generators
  function hexagonPath(r) {
    const a = Math.PI / 3;
    let pts = [];
    for (let i = 0; i < 6; i++) {
      pts.push([r * Math.cos(a * i - Math.PI / 6), r * Math.sin(a * i - Math.PI / 6)]);
    }
    return pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ') + 'Z';
  }
  function diamondPath(r) {
    return `M0,${-r} L${r},0 L0,${r} L${-r},0 Z`;
  }
  function squarePath(r) {
    return `M${-r},${-r} L${r},${-r} L${r},${r} L${-r},${r} Z`;
  }

  // Draw nodes
  const node = g.append('g').selectAll('g')
    .data(nodes)
    .join('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) graphSim.alphaTarget(0.15).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.each(function(d) {
    const cfg = typeConfig[d.type] || typeConfig.file;
    const el = d3.select(this);
    const r = d.type === 'file' ? Math.max(4, Math.min(14, Math.sqrt((d.size || 1000) / 500))) : cfg.r;
    d._r = r;

    if (cfg.shape === 'circle') {
      el.append('circle')
        .attr('r', r)
        .attr('fill', cfg.color + '30')
        .attr('stroke', cfg.color)
        .attr('stroke-width', 1.5);
    } else if (cfg.shape === 'hexagon') {
      el.append('path')
        .attr('d', hexagonPath(r))
        .attr('fill', cfg.color + '30')
        .attr('stroke', cfg.color)
        .attr('stroke-width', 1.5);
    } else if (cfg.shape === 'diamond') {
      el.append('path')
        .attr('d', diamondPath(r))
        .attr('fill', cfg.color + '30')
        .attr('stroke', cfg.color)
        .attr('stroke-width', 1.5);
    } else if (cfg.shape === 'square') {
      el.append('path')
        .attr('d', squarePath(r))
        .attr('fill', cfg.color + '30')
        .attr('stroke', cfg.color)
        .attr('stroke-width', 1.5);
    }
  });

  // Node labels (togglable)
  const labels = g.append('g').selectAll('text')
    .data(nodes)
    .join('text')
    .text(d => {
      const name = d.label || d.name || '';
      if (d.type === 'chat_session') return '';
      if (d.type === 'run') return '';
      if (name.length > 25) return name.substring(0, 22) + '...';
      return name;
    })
    .attr('font-size', d => d.type === 'folder' ? '9px' : '7px')
    .attr('font-family', 'var(--font)')
    .attr('fill', 'var(--text-dim)')
    .attr('text-anchor', 'middle')
    .attr('dy', d => (d._r || 8) + 12)
    .attr('pointer-events', 'none')
    .style('opacity', 0.8);

  // Wire up labels toggle
  document.getElementById('graph-toggle-labels')?.addEventListener('change', (e) => {
    labels.style('display', e.target.checked ? null : 'none');
  });
  // Respect initial checkbox state
  const labelsCheckbox = document.getElementById('graph-toggle-labels');
  if (labelsCheckbox && !labelsCheckbox.checked) {
    labels.style('display', 'none');
  }

  // Enhanced tooltip with neighbor highlight
  const tooltip = document.getElementById('graph-tooltip');
  node.on('mouseover', (e, d) => {
    tooltip.style.display = 'block';
    const ttName = tooltip.querySelector('.tt-name');
    const ttType = tooltip.querySelector('.tt-type');
    ttName.textContent = d.label || d.name;

    let details = d.type;
    if (d.category) details += ' \u00b7 ' + d.category;
    if (d.size) details += ' \u00b7 ' + formatBytes(d.size);
    if (d.run_count) details += ' \u00b7 ' + d.run_count + ' runs';
    if (d.path) details += '\n' + (d.path.length > 50 ? '...' + d.path.slice(-47) : d.path);
    ttType.textContent = details;

    // Neighbor highlight: dim non-connected nodes
    const connectedIds = new Set();
    connectedIds.add(d.id);
    edges.forEach(edge => {
      const sid = typeof edge.source === 'object' ? edge.source.id : edge.source;
      const tid = typeof edge.target === 'object' ? edge.target.id : edge.target;
      if (sid === d.id) connectedIds.add(tid);
      if (tid === d.id) connectedIds.add(sid);
    });
    node.selectAll('circle, path').attr('opacity', n => connectedIds.has(n.id) ? 1 : 0.15);
    link.attr('opacity', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return (sid === d.id || tid === d.id) ? 0.8 : 0.03;
    });
    labels.style('opacity', n => connectedIds.has(n.id) ? 1 : 0.1);
  }).on('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
  }).on('mouseout', () => {
    tooltip.style.display = 'none';
    // Restore full opacity on all nodes and edges
    node.selectAll('circle, path').attr('opacity', 1);
    link.attr('opacity', d => (edgeConfig[d.type] || edgeConfig.contains).opacity);
    labels.style('opacity', 0.8);
  });

  // Click -> rich sidebar with file content + neighbors
  const sidebar = document.getElementById('graph-sidebar');
  const sidebarDetails = document.getElementById('sidebar-details');
  node.on('click', (e, d) => {
    e.stopPropagation();
    sidebar.classList.add('open');

    // Build rich metadata
    sidebarDetails.innerHTML = buildSidebarMetadata(d, edges);

    // For file nodes, load inline file content and neighbors
    if (d.type === 'file' && d.path) {
      // "Open in Floating Panel" button
      const openBtnDiv = document.createElement('div');
      openBtnDiv.style.marginTop = '0.8rem';
      openBtnDiv.innerHTML = `<button style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid rgba(124,58,237,0.3);background:rgba(124,58,237,0.1);color:var(--primary);font-family:var(--font);font-weight:600;font-size:0.8rem;cursor:pointer;transition:all 0.2s">Open in Floating Panel</button>`;
      openBtnDiv.querySelector('button').addEventListener('click', () => {
        openFloatingPanel(d.path);
      });
      sidebarDetails.appendChild(openBtnDiv);

      // "View in Inspector" button
      const inspBtnDiv = document.createElement('div');
      inspBtnDiv.style.marginTop = '0.4rem';
      inspBtnDiv.innerHTML = `<button style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);color:#22c55e;font-family:var(--font);font-weight:600;font-size:0.8rem;cursor:pointer;transition:all 0.2s">View in Inspector</button>`;
      inspBtnDiv.querySelector('button').addEventListener('click', () => {
        switchTab('inspector');
        setTimeout(() => loadFile(d.path), 200);
      });
      sidebarDetails.appendChild(inspBtnDiv);

      // Load file content inline
      loadSidebarFileContent(d.path, sidebarDetails);

      // Load related files
      loadSidebarNeighbors(d.path, sidebarDetails);
    }

    // For chat_session nodes, load the chat messages
    if (d.type === 'chat_session') {
      // Extract session_id from the node (d.id is like "chat:agentname/chat_xxxxx")
      const sessionId = d.label || d.id.split('/').pop();

      // "Open in Floating Panel" button for chats
      const chatFloatBtn = document.createElement('div');
      chatFloatBtn.style.marginTop = '0.8rem';
      chatFloatBtn.innerHTML = `<button style="width:100%;padding:0.6rem;border-radius:8px;border:1px solid rgba(6,182,212,0.3);background:rgba(6,182,212,0.1);color:var(--secondary);font-family:var(--font);font-weight:600;font-size:0.8rem;cursor:pointer;transition:all 0.2s">Open Chat in Floating Panel</button>`;
      chatFloatBtn.querySelector('button').addEventListener('click', () => {
        openFloatingChatPanel(sessionId);
      });
      sidebarDetails.appendChild(chatFloatBtn);

      // Load chat messages inline in sidebar
      loadSidebarChat(sessionId, sidebarDetails);
    }

    // Highlight selected node and its connections
    node.selectAll('circle, path').attr('opacity', 0.3);
    d3.select(e.currentTarget).selectAll('circle, path').attr('opacity', 1);
    link.attr('opacity', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return (sid === d.id || tid === d.id) ? 0.8 : 0.05;
    });
  });

  // Double-click file -> open floating panel (instead of switching tabs)
  node.on('dblclick', (e, d) => {
    if (d.type === 'file' && d.path) {
      e.stopPropagation();
      openFloatingPanel(d.path);
    }
  });

  // Click background -> close sidebar and restore opacity
  svg.on('click', () => {
    sidebar.classList.remove('open');
    node.selectAll('circle, path').attr('opacity', 1);
    link.attr('opacity', d => (edgeConfig[d.type] || edgeConfig.contains).opacity);
    labels.style('opacity', 0.8);
  });

  document.getElementById('sidebar-close').addEventListener('click', () => {
    sidebar.classList.remove('open');
    node.selectAll('circle, path').attr('opacity', 1);
    link.attr('opacity', d => (edgeConfig[d.type] || edgeConfig.contains).opacity);
    labels.style('opacity', 0.8);
  });

  // Search
  const searchInput = document.getElementById('graph-search');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) {
      node.selectAll('circle, path').attr('opacity', 1);
      link.attr('opacity', d => (edgeConfig[d.type] || edgeConfig.contains).opacity);
      labels.style('opacity', 0.8);
      return;
    }
    node.selectAll('circle, path').attr('opacity', d => d.name.toLowerCase().includes(q) ? 1 : 0.1);
    link.attr('opacity', 0.05);
    labels.style('opacity', d => d.name.toLowerCase().includes(q) ? 1 : 0.1);
  });

  // Tick — update positions of links, nodes, and labels
  graphSim.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
    labels.attr('x', d => d.x).attr('y', d => d.y);
  });
}

async function loadTimeline() {

      </div>
      <div class="tl-meta">
        <span style="font-family:var(--mono)"><span style="color:${item.workspace === 'host' ? 'var(--accent-orange)' : 'var(--secondary)'};font-weight:600">[${item.workspace || 'agent'}]</span> ${item.path || ''}</span>
        ${item.size != null ? `<span>${formatBytes(item.size)}</span>` : ''}
